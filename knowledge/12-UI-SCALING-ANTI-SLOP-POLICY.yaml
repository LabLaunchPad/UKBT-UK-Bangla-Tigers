# UI scaling / "anti-slop" policy, adopted 2026-08-31.
# Evidence: EV-20260831-009. Trigger: explicit user request to apply
# fluid-scaling / no-layout-shift best practices to card-heavy pages
# (roster grids, franchise cards, sponsor rows) as the roster/franchise
# content grows.
#
# CLASSIFICATION of this file: DERIVED policy (general CSS/web-platform
# engineering practice — box model, compositor-only animation, aspect-ratio,
# line-clamp — not a UKBT-specific fact). It governs HOW future components
# are written; it invents no fact about UKBT, Adelux, or any person.
#
# This does not reopen contracts/CSS-CONTRACT.md or
# contracts/COMPONENT-CONTRACT.md (both FROZEN, both about the token
# pipeline / component-contract *shape*, not per-property authoring rules).
# It sits alongside them the same way 09/10/11 sit alongside CLAUDE.md: a
# compact checklist an agent reads before writing or touching card/grid CSS.

stack_reality:
  # docs/14-tool-selection-layer.md already establishes this; restated here
  # so a rule below is never read as "use Tailwind utility classes".
  styling: plain component-scoped CSS in .astro <style> blocks
  variables: CSS custom properties generated by Style Dictionary from
    packages/truth/tokens/approved/** (contracts/CSS-CONTRACT.md) —
    every raw px/rem/color value below is illustrative of the RULE, the
    real component always spends an existing --ukbt-* token, never a
    literal, per CSS-CONTRACT.md's APPROVED-only-compile invariant.
  framework: Astro, output static, near-zero client JS by default

rules:
  - id: SLOP-01
    name: Never animate layout-affecting properties on hover/expand
    do: transform (scale/translate) and opacity only, both compositor-only
    dont: width, height, top/left, margin, font-size as a transition target
    why: a width/height transition forces reflow of every sibling in the
      same flex/grid row — the page visibly jitters
    repo_state: >
      COMPLIANT today. The only hover-affecting transition in the
      component tree is Card.astro's box-shadow (a paint-only property,
      not layout-affecting). No component currently transitions width,
      height, or a grid-track size. This rule exists to hold that line as
      more interactive cards (roster/franchise/sponsor) are added.
    applies_to: any future :hover / :focus-within scale treatment added to
      RosterGrid.astro, Card.astro, FranchiseTeaser.astro, TournamentCard.astro

  - id: SLOP-02
    name: Card grids use CSS Grid auto-fill/minmax, never a fixed card count
    do: "grid-template-columns: repeat(auto-fill, minmax(<min>, 1fr))"
    dont: hardcoding N columns for a roster/franchise list whose length is
      real, evidenced, and will grow (players-data.ts, franchises-data.ts)
    why: a fixed column count either leaves ragged trailing whitespace or
      forces a hand-maintained breakpoint per data-length change
    repo_state: >
      COMPLIANT. RosterGrid.astro already uses
      `repeat(auto-fill, minmax(11rem, 1fr))`. This is the pattern to copy
      for any new roster-shaped or sponsor-shaped grid, not to reinvent.

  - id: SLOP-03
    name: Photos declare aspect-ratio and object-fit, never bare width/height CSS
    do: "aspect-ratio: <ratio>; object-fit: cover;" plus explicit HTML
      width/height attributes (prevents CLS before CSS loads, per the
      HTML spec's intrinsic-size mechanism)
    dont: an <img> with only a CSS width and no ratio/fit — it distorts or
      reflows as the real (evidenced) photo's dimensions vary
    repo_state: >
      COMPLIANT. RosterGrid.astro's `__photo` rule already sets
      `aspect-ratio: 1 / 1; object-fit: cover;` alongside HTML
      width="160" height="160". Apply the same pair to any new photo
      surface (team-official cards, future sponsor logos with variable
      source dimensions).

  - id: SLOP-04
    name: Unbounded free text inside a fixed/min-height card gets a line-clamp
    do: >
      display: -webkit-box; -webkit-line-clamp: <n>;
      -webkit-box-orient: vertical; overflow: hidden;
      (the de facto cross-browser standard for clamped multi-line
      truncation; Chromium/Firefox/Safari all implement the -webkit-
      prefixed form even outside WebKit)
    dont: let a card with min-height (not height) rely on "it'll probably
      stay short" for content that is real free text with no schema
      length ceiling (a headline, a note, a tagline)
    repo_state: >
      GAP FOUND AND FIXED (this change). NewsTeaser.astro's
      `.ukbt-news__card h4` sat in a `min-height: 20rem` card with no
      clamp — a real risk once real post titles land (CONTENT-CONTRACT.md
      places no length ceiling on a headline). Currently unreachable
      (no page passes `posts`, so the card never renders today) — fixed
      pre-emptively per this policy's own SLOP-04, not because a visible
      defect was observed.
    checked_and_low_risk: >
      RosterGrid.astro's `note`/`tags` and FranchiseTeaser.astro's fact
      `body` strings are short, evidence-sourced, editorial copy (not
      open-ended user/CMS input) — no clamp added; re-evaluate if a future
      data source makes these fields open-ended.

  - id: SLOP-05
    name: Interface icons are inline SVG, never a raster (PNG/JPG) icon asset
    do: inline <svg> with currentColor fill/stroke, as Footer.astro and
      Header.astro already do for every social/menu icon
    dont: a PNG/JPG for anything that is a UI icon rather than a real
      photograph or brand mark
    repo_state: >
      COMPLIANT. No raster icon exists anywhere in apps/web/src/components.
      Raster (.png/.jpg) usage is confined to real photography (roster
      portraits) and brand marks (crest, sponsor logos) — both correctly
      raster since they are captured images, not vector-drawable glyphs,
      and both already covered by contracts/ASSET-CONTRACT.md's provenance
      requirement, which this policy does not relax or duplicate.

  - id: SLOP-06
    name: Card internal spacing and radii come from --ukbt-space-*/--ukbt-radius-* tokens only
    do: token-driven padding/gap/border-radius, as every existing card
      component already does
    dont: a literal px/rem value for spacing or radius inside a card
    repo_state: >
      COMPLIANT across Card.astro, RosterGrid.astro, TournamentCard.astro,
      FranchiseTeaser.astro, Sponsors.astro, LeadershipGrid.astro — already
      enforced structurally by CSS-CONTRACT.md's APPROVED-token-only
      compile gate (a literal value is a code-review catch, not just a
      style preference).

  - id: SLOP-07
    name: Fluid heading sizes (clamp()) are a Track-B/design-token decision, not a per-component override
    do: if a heading needs fluid sizing, propose it as a token change in
      packages/truth/src/tokens/, evidenced the way
      --ukbt-font-size-display already is (EV-20260826-family,
      typography.json's own DERIVED classification comment)
    dont: hand-adding `font-size: clamp(...)` literals inside a component
      <style> block, bypassing the token pipeline
    why_not_widened_now: >
      Only `--ukbt-font-size-display` (the hero headline) is fluid today;
      `--ukbt-font-size-0` through `-6` are fixed rem steps, matched to
      the reference's own discrete-step behavior at Stage 6
      (REFERENCE-ANALYSIS.md §2). Making every heading level fluid is a
      visual-parity-affecting token change, not a defensive hardening —
      out of this policy's scope. Not a defect; a scoped-out decision,
      named here so it isn't silently revisited later (anti_drift AD-03).

verification:
  # This policy adds no new CI gate. Compliance is checked the same way
  # every other visual claim in this repo is checked:
  method: contracts/VISUAL-REGRESSION-CONTRACT.md's existing suite
    (screenshots.spec.ts, pages.spec.ts overflow checks, mobile-axe.spec.ts)
    — a SLOP-01..07 violation that actually changes rendered output would
    already fail horizontal-overflow or visual-diff checks; this file's
    job is to stop the violation from being written, not to add a second
    detector for the same failure.

never:
  - "Do not restate this policy's rule text as a UKBT verified fact."
  - "Do not treat 'the pasted best-practices list said so' as evidence for
     a UKBT-specific claim — it is a general engineering practice, applied
     here by agent judgement, distinct from an evidenced project fact."
  - "Do not widen SLOP-07 into a token rewrite without a new evidence
     record naming the parity gap that justifies it."
