# Roles are a vocabulary of accountability. They are NOT a spawn list.

agents:
  planner:
    responsibility: [inspect, reason, propose]
    may_modify_code: false
  implementer:
    responsibility: [implement_approved_plan]
    may_modify_code: true
  verifier:
    responsibility: [deterministic_verification, tests, contract_checks]
    may_modify_code: false
  visual_verifier:
    responsibility: [visual_comparison, responsive_review]
    may_modify_code: false

rule: "Do not create an agent merely because a task exists."

independence:
  principle: >
    The agent that proposes a critical architectural decision should not be the
    sole authority that verifies it.
  mechanism: SEPARATE_SESSION
  detail: >
    Independence comes from NOT INHERITING CONTEXT. A subagent sharing this
    session's context provides none of it. Where independence is the point, use a
    separate session; a subagent is the wrong tool.

current_topology:
  sessions: 1
  subagents: 0
  agents_directory: ".claude/agents/ — empty by design"
  rationale: >
    Deterministic checkpoints between stages do the work multi-agent topology is
    usually reached for. Agent-count inflation is adversarial case ADV-004.

  roles_in_practice:
    planner_implementer_verifier: >
      Collapsed into one session per stage, separated in TIME by the stage gates
      rather than in SPACE by agent boundaries. The gate is what enforces that
      proposing and verifying are distinct acts.
    visual_verifier: >
      NOT a separate agent. It is the verifier role with different tools.
      Splitting it creates a handoff, not an independence gain.

  scheduled_exception:
    stage: 8
    what: homepage red team
    why: "separate session so it cannot inherit the implementer's assumptions"

when_to_add_a_specialist:
  all_must_hold:
    - the foundation stage has passed verification
    - a named, OBSERVED failure mode is attributable to single-session work
    - the agent has a NARROWER tool surface than its parent, never wider
    - its addition is recorded as an evidence record

concurrency:
  single_writer: true
  rationale: "G16 — concurrent agents collide. Stage 9 is per-page and sequential."

harness_health:
  rule: "The harness must reduce drift, not become another architecture problem."
  current: "12 slash commands mapping 1:1 to prompts, no added indirection."

# ---------------------------------------------------------------------------
# Visual-work role vocabulary, adopted 2026-08-31 (EV-20260831-003).
# Long form: docs/13-visual-truth-system.md § 4-5.
# This EXTENDS the vocabulary above; it does not repeal anything above it.
# In particular `rule: "Do not create an agent merely because a task exists"`,
# SEPARATE_SESSION independence, and single_writer all still bind.
# ---------------------------------------------------------------------------
visual_roles:
  preamble: >
    Nine roles are CAPABILITIES, not a spawn list. Defining them here does not
    satisfy when_to_add_a_specialist below, and does not authorise populating
    .claude/agents/. The orchestrator activates the minimum necessary subset.
  roles:
    orchestrator:      {writes_code: false, independence: control}
    grounding_truth:   {writes_code: false, independence: independent}
    visual_forensics:  {writes_code: false, independence: independent}
    past_visual_context: {writes_code: false, independence: independent}
    ux_responsive:     {writes_code: false, independence: independent}
    visual_diff:       {writes_code: false, independence: separate_session_for_gate}
    implementation:    {writes_code: true,  independence: single_writer}
    final_red_team:    {writes_code: false, independence: separate_session}
    release_receipt:   {writes_code: false, independence: independent}

  activation:
    standard_ui_reconstruction:
      [orchestrator, grounding_truth, visual_forensics, ux_responsive,
       implementation, visual_diff, release_receipt]
    history_sensitive: "add past_visual_context"
    critical_visual_gate: "run visual_diff in a SEPARATE SESSION"
    release_critical: "run final_red_team then release_receipt in INDEPENDENT CONTEXT"

  never:
    - "full topology does not mean full spawning"
    - "no specialist without incremental evidence value"
    - "no duplicated specialist responsibilities"
    - "no verifier relying solely on implementer output"
    - "no concurrent application-code writers"
    - "no claim of independence when contexts were in fact shared"

  orchestrator_must_not:
    - invent visual conclusions
    - override evidence
    - approve its own critical implementation
    - silently revise contracts
    - treat chat history as truth
    - declare PASS without the required evidence
