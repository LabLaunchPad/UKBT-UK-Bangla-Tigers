    Literal code porting is VERIFIED permitted (bounded to one end product).
    Full grammar reimplementation without copied expression (U-26) is
    reasoned in EV-20260826-024 as a conservative, likely-permitted reading
    of "modification to build an End Product" — not independently verified
    against Envato's live terms text (WebFetch unavailable this session),
    so treat as likely rather than certain.
  note: >
    The template has NOT been admitted to this repository. It is excluded pending
    licence evidence. A prior record "EV-0009" and an admission status of
    ADMITTED_WITH_RESTRICTIONS were referenced by the requester but do not exist
    here; a repository search returns no match. Reported, not reconciled.

