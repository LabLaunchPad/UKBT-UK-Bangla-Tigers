    themeforest_item_id: "60543035"
    themeforest_url: "https://themeforest.net/item/adelux-padel-club-community-html-bootstrap-template/60543035"
    envato_elements_slug: "X3FTRWG"
    envato_elements_item_id: "3acc4547-3059-449d-a632-944acef7bc53"  # from EV-20260826-024's certificate URL
    note: >
      U-25 RESOLVED: the applicable channel is Envato Elements (subscription
      model), confirmed via EV-20260826-024's license certificate — not the
      ThemeForest tiered-purchase channel.
  other_website_reuse: PROHIBITED_ABSENT_ADDITIONAL_LICENCE
  other_website_reuse_note: >
    Structural finding, not a paperwork gap: every standard Envato acquisition
    path caps at ONE end product. Confirmed via EV-20260826-006, and this is
    exactly why EV-20260826-025 (confirming this license's one End Product is
    UKBT exclusively) was required before Track B could unlock.
  cross_framework_reimplementation: LIKELY_PERMITTED  # softened from LEGAL_REVIEW_REQUIRED, EV-20260826-024
