template:
  name: Adelux
  version: "1.0.0"
  sha256: cf4907bb60003b719f3d7712e2d06389c2ab7f8a02590bdea570da9780cafb54
  status: NOT_ADMITTED           # excluded from the repository pending licence
  license_status: STATED_BUT_UNVERIFIED
  evidence: [EV-20260826-005, EV-20260826-006]
  in_repository: false
  marketplace:
    themeforest_item_id: "60543035"
    envato_elements_slug: "X3FTRWG"
    channel_used: UNKNOWN        # U-25 — two different licensing models possible
  other_website_reuse: PROHIBITED_ABSENT_ADDITIONAL_LICENCE
  cross_framework_reimplementation: LEGAL_REVIEW_REQUIRED   # U-26

# Actions permitted at the CURRENT status (NOT_ADMITTED, licence unverified).
allowed_now:
  - inspect                       # read-only, outside the repository
  - analyze
  - record_package_identity
not_allowed_now:
  - extract_design_patterns       # gated on licence — Stage 6
  - adapt_layout
  - adapt_components
  - adapt_tokens
  - copy_any_file_into_repository

# Actions that become permitted once LICENSE_VERDICT = VERIFIED.
allowed_when_verified:
  - extract_design_patterns
  - adapt_layout
  - adapt_components
  - adapt_tokens
  - create_UKBT_implementation

never_allowed_without_specific_evidence:
  - claim_ownership
  - claim_unrestricted_redistribution
  - claim_resale_rights
  - claim_sublicensing_rights
  - redistribute_original_template
  - assume_third_party_asset_rights
  - use_adelux_own_branding        # Adelux-Logo.png etc. are the author's marks

boundary:
  Adelux:              {role: DESIGN_SOURCE}
  UKBT_content:        {role: PROJECT_TRUTH}
  third_party_assets:  {role: SEPARATE_RIGHTS_DOMAIN}
  generated_code:      {role: UKBT_IMPLEMENTATION}

leak_paths:
  - id: LP-01
    path: "template demo content → UKBT factual content"
    control: "INV-001, INV-002; truth gate rejects template-sourced facts"
  - id: LP-02
    path: "REFERENCE-ANALYSIS.md → Stage 9 route/content matrix"
    detail: >
      The reference is a padel-club template. Its sections (courts, coaching,
      membership tiers, booking) are TEMPLATE facts. Deriving UKBT's information
      architecture from them makes the template a source of UKBT truth without
      any single step looking like an invention.
    control: "INV-014 — reference informs visual grammar only"
  - id: LP-03
    path: "template licence → bundled third-party component rights"
    detail: "A licensor cannot sublicense rights it does not hold (DR-019)."
    control: "third-party components verified independently, per component"

third_party_rights:
  rule: "Each bundled component is a separate rights domain. Verify individually."
  verified_permissive: [bootstrap, jquery, swiper, flatpickr]
  attribution_required: [font-awesome]           # CC BY 4.0 icons
  requires_decision: [animate.css]               # Hippocratic License 2.1
  blocked: [isotope]                             # GPLv3 or paid commercial licence
  unknown: [fslightbox, odometer, lato, montserrat]
  note: >
    A10 proposes no third-party UI library, which cheaply avoids most of this.
    Not adopting a component must be a RECORDED decision, not an accident.

decisions:
  - {component: isotope, decision: DO_NOT_ADOPT, reason: "no demonstrated need; independent GPLv3/commercial obligation", date: 2026-08-26}
  - {component: animate.css, decision: DO_NOT_ADOPT, reason: "no demonstrated need; Hippocratic 2.1 not sign-off-cleared", date: 2026-08-26}

privacy:
  finding: "Shipped font CSS loads Lato/Montserrat from fonts.gstatic.com."
  consequence: "Third-party requests disclose visitor IPs. UK GDPR relevance (U-18)."
  rule: "Self-host fonts, or record a lawful basis. Do not carry this over unexamined."

# Lifecycle states — added 2026-08-26 at the requester's explicit direction.
# Distinguishes "we can inspect/analyze" from "we are licensed to distribute."
# BL-02 gates state 3 for Adelux-derived material. It does not gate state 1,
# and state 2 may proceed for UKBT-original work that merely LEARNED from state 1.
lifecycle_states:
  FORENSIC_ANALYSIS:
    permits: [inspect, analyze, record_package_identity, structural_inventory,
              css_ast_parsing, selector_specificity_analysis, cascade_tracing,
              computed_style_extraction, geometry_measurement,
              token_candidate_extraction, component_candidate_discovery,
              interaction_state_measurement, responsive_diff_analysis]
    forbids: [copy_asset_into_repo, persist_screenshot_of_source,
              redistribute_source, promote_token_to_approved,
              claim_production_clearance]
    gated_by_BL02: false
    note: >
      CORRECTED 2026-08-26, superseding the same-day version above. The
      original list forbade "extract_css_values" and "extract_computed_styles"
      under FORENSIC_ANALYSIS, which conflicts with the requester's explicit,
      specific direction the same day: "Continue those activities as
      controlled forensic analysis" naming CSS AST analysis, DOM analysis,
      computed-style extraction, responsive analysis, and token CANDIDATE
      extraction by name as things that do not stop merely because BL-02 is
      open. Per CLAUDE.md's authority order, current user instruction outranks
      a self-authored knowledge file — this was this file being wrong, not the
      instruction being an exception to correctly-drawn rule. The line was
      imprecise, not the direction.

      The corrected line: FORENSIC_ANALYSIS permits deriving and recording
      what the source's DOM/CSS/behaviour actually IS — including its
      literal property:value declarations, computed styles, and specificity —
      because that is analysis and documentation, not reuse. It still forbids
      copying binary assets or screenshots into this repository, redistributing
      the source itself, and — the line that actually matters — promoting a
      token past CANDIDATE or claiming any of this is cleared for
      PRODUCTION_RELEASE. That promotion/clearance boundary is BL-02's real
      job, not a boundary around understanding the source at all.
  UKBT_IMPLEMENTATION:
    permits: [build_ukbt_original_code, build_ukbt_original_tokens,
              build_ukbt_original_content]
    forbids: [embed_adelux_licensed_expression, embed_adelux_brand_assets]
    gated_by_BL02: "only for the portion that embeds Adelux's own expression"
    note: >
      UKBT-original code informed by observed grammar (not copied expression)
      may proceed per DR-... the idea/expression line itself is U-26,
      LEGAL_REVIEW_REQUIRED — treat literal CSS/token/markup extraction from
      Adelux as embedding its expression until that resolves.
  PRODUCTION_RELEASE:
    permits: []
    forbids: [ship_any_rights_gated_material, ship_adelux_brand_assets,
              ship_blocked_third_party_component]
    gated_by_BL02: true
    note: >
      Every RIGHTS_GATED and LICENSE_BLOCKED item catalogued anywhere in
      artifacts/ must resolve to a cleared status before this state, or be
      excluded. This is Part 24 of the visual-fidelity protocol
      (final license/provenance gate) — it is not optional and not implied by
      reaching a working local build.

golden_reference_rights_note: >
  A screenshot of the rendered Adelux site is itself a reproduction of
  Adelux's licensed visual expression — the same rights question as the
  source files, not a separate one. Per FORENSIC_ANALYSIS above,
  "persist_screenshot_of_source" is forbidden: such captures may be used
  TRANSIENTLY for local comparison during analysis, but must never be
  committed to this repository as "golden references" while BL-02 is open.
  If BL-02 clears, screenshots become the same class of material as the
  source itself and inherit whatever the cleared licence permits — no more,
  no less.
