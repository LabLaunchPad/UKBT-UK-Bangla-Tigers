name: CI

# Implements the gate set required by contracts/CI-CONTRACT.md, to the
# extent those gates are meaningfully checkable at the FOUNDATION stage
# (no real routes/content exist yet — see the note at the bottom of this
# file for gates deliberately not wired yet, and why).
#
# Every job here is REQUIRED (merge-blocking) unless explicitly marked
# otherwise — a job that cannot fail the build is decorative
# (knowledge/08-VALIDATION-POLICY.yaml, DR-010).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, never `-latest` — contracts/VISUAL-REGRESSION-CONTRACT.md
  # requires a pinned runner image so visual comparisons stay CI-vs-CI
  # deterministic, not just for the visual job but as a repo-wide rule.
  NODE_VERSION: '22'

jobs:
  install:
    name: Install (frozen lockfile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

  governance-scaffold:
    name: Governance scaffold self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/scaffold-self-test.mjs

  dependency-allowlist:
    name: Dependency allowlist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-dependency-allowlist.mjs

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-24.04
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ukbt/truth tokens:build
      - run: pnpm typecheck

  unit-tests:
    name: Unit / integration tests (truth gate + content schema)
    runs-on: ubuntu-24.04
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  build:
    name: Build (tokens + Astro static output)
    runs-on: ubuntu-24.04
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build-output
          path: apps/web/dist
          retention-days: 7

  visual-and-accessibility:
    name: Playwright (structural / responsive / accessibility)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------------------------------------------------------------------
# CI-CONTRACT.md gates deliberately NOT wired yet, and why (ABSENT != PASS,
# knowledge/08-VALIDATION-POLICY.yaml — recorded honestly rather than
# faked with a vacuous always-pass step):
#
#   - Content schema validation against real content: no content files
#     exist yet (packages/truth/src/content/ is not created — CONTENT-
#     CONTRACT.md, zero real UKBT facts, BL-01). Unit tests already
#     validate the schemas themselves against synthetic fixtures.
#   - Truth gate against real content: same reason. The gate's rule logic
#     (T1-T9) is unit-tested; there is no real content to gate yet.
#   - Placeholder detection in a production build: no page renders any
#     content field yet — the placeholder homepage has no org-fact field
#     to check.
#   - Route/link integrity: only one route (the placeholder homepage)
#     exists; a link-integrity check has nothing meaningful to traverse.
#   - SEO metadata completeness: no metadata pipeline exists yet
#     (contracts/SEO-CONTRACT.md) — Stage 4+ work once real routes exist.
#
# These become real, addable jobs once packages/truth/src/content/ and
# real routes exist (contracts/CONTENT-CONTRACT.md, contracts/ROUTE-
# CONTRACT.md) — adding a job here at that point, not before.
# ---------------------------------------------------------------------------
