notes: >
  EV-20260826-004 is NOT superseded: it recorded the undertaking to supply a
  licence record, and that undertaking still stands unfulfilled. This record adds
  the verification attempt and its result.

  The task brief referenced a prior record "EV-0009" and an admission status of
  ADMITTED_WITH_RESTRICTIONS. Neither exists in this repository; a search returns
  no match and the template has never been admitted here. Reported, not
  reconciled. No conclusion here rests on EV-0009.

  SEPARATE BLOCKER DISCOVERED, independent of Adelux: the bundled
  isotope.pkgd.min.js v3.0.6 declares "Licensed GPLv3 for open source use or
  Isotope Commercial License for commercial use" (Metafizzy). A commercial UKBT
  deployment needs a Metafizzy commercial licence or GPLv3 compliance. No Adelux
  licence tier can convey this, because Fox Creation cannot sublicense rights it
  does not hold. Cheaply avoided by not adopting Isotope, which A10 already
  proposes — but that must be a recorded decision.

  Also evidenced: animate.css 4.1.1 is Hippocratic License 2.1 (not OSI-approved,
  ethical-use conditions); Font Awesome Free 6.7.2 icons are CC BY 4.0 and carry
  a live attribution obligation; the shipped font CSS loads Lato and Montserrat
  from fonts.gstatic.com, disclosing visitor IPs to a third party (U-18).
