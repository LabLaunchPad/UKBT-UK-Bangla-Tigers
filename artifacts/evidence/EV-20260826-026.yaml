result: |
  REAL CONTENT NOW ON RECORD (first substantive UKBT organizational facts
  since bootstrap — closes/narrows several long-open unknowns,
  artifacts/bootstrap/UNKNOWN-EVIDENCE.md):

  - Sport/activity: cricket, franchise T20/T10/50-over format (closes
    U-02).
  - Organization shape: UK Bangla Tigers is one of at least two sister
    franchise teams (the other: Uppsala Tigers, Sweden) under a shared
    site/brand umbrella — narrows U-01, does not fully close it (purpose/
    audience beyond "a cricket franchise" still not stated).
  - Leadership: Acting Chairman named as MD Shahidul Alam Ratan (with an
    explicit correction instruction: the site must say "Acting Chairman,"
    not "Chairman") — narrows U-04 (chairman only; full committee/roster
    still not supplied).
  - Club Captain: Mohammad Chowdhury — full biography, DOB, nationality,
    playing style, career history across 9 named franchise/national
    teams, full batting/bowling statistics tables (3 formats each), 6
    external statistics-provider profile links, personal social media
    links. A real, complete example of one player-profile page.
  - Tournament calendar: 5 named events with status/date/country (2
    upcoming: Nordic Lights Sep 2026 Norway, Global T20 Championship Oct
    2026 Romania; 3 completed: Safari International T20 Cup Jul 2026 UAE,
    Nordic Smash T20 Jun 2026 Sweden, Asian Challengers Trophy Jan 2020
    Nepal) — narrows U-06 (tournament-level only; no match-by-match
    fixtures/results/standings supplied).
  - Site-wide aggregate stats: "30+ Players," "15+ Countries
    Internationals," "7+ International Tournaments."
  - Official social media: UK Bangla Tigers (Facebook, Instagram, TikTok,
    X) and Uppsala Tigers (Facebook, Instagram, X), all with real URLs.

  STILL UNKNOWN / NOT SUPPLIED BY THIS DOCUMENT (unaffected — not
  narrowed by this record):
  - U-05 (brand assets: logo file, crest, colours, typefaces) — the
    profile-picture slot itself says "Choose one from the attached," but
    no image was attached to this upload. No logo, colour, or typography
    evidence exists in this document.
  - U-03 (founding date, founders, history, honours), U-07 (sponsors/
    partners), U-16 (venue/contact details), U-17 (photography ownership/
    consent) — untouched.
  - Full player roster beyond the Club Captain, full committee beyond the
    Acting Chairman, "About Us" narrative content, match-by-match
    fixtures/results — untouched.
