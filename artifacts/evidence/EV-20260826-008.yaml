notes: >
  This record is explicitly scoped to the FORENSIC_ANALYSIS lifecycle state
  (added to knowledge/06-TEMPLATE-BOUNDARY.yaml this pass, at the requester's
  direction). It does not authorize, and is not evidence toward, PRODUCTION_RELEASE
  of any Adelux-derived material. BL-02 is unchanged: STATED_BUT_UNVERIFIED.

  Separately, this pass found that the visual-fidelity protocol's proposed
  "golden reference" screenshots of the rendered Adelux site would themselves
  be reproductions of its licensed visual expression - not analysis, but a
  copy in a different format. Recorded as a required revision in
  artifacts/verification/ARCHITECTURE-REDTEAM-ADDENDUM-VISUAL-TOOLCHAIN.md:
  such screenshots may be used transiently for local comparison but must never
  be committed to this repository while BL-02 is open.
