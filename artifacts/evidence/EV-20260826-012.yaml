justification_for_null: >
  This record documents the pack's contents as found on this date. It does
  not expire; a future, different pack would be new evidence.
scope: "BL-02 (Adelux licence). Does not affect FORENSIC_PERMISSION or pipeline stages 1-2, which were already ALLOWED independent of BL-02."
method: >
  Full read of every file in the archive: LABLAUNCHPAD-BUILDER-LICENSE.md,
  TEMPLATE-AUTHORITY.md, TEMPLATE-PROVENANCE.md, LICENSE-EVIDENCE/00-README.md,
  01-BUILDER-ATTESTATION-TEMPLATE.md, 02-CLAUDE-CODE-GROUNDING.yaml,
  03-RIGHTS-MATRIX.yaml, 04-CLAUDE-CODE-RESOLUTION.md. Cross-checked the
