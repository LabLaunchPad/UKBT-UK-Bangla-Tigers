classification: CONFLICTING
claim: >
  A supplied "LabLaunchPad_Adelux_UKBT_Authority_Pack" asserts that
  LabLaunchPad authored the Adelux template and is therefore its builder/
  rights holder, entitling LabLaunchPad to authorize UKBT adaptation
  (framing this as closing sub-blockers BL-02A/BL-02C).
