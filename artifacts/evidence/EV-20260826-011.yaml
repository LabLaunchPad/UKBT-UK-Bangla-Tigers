result: |
  Two stale cross-references found, both self-inflicted by this session's
  own prior repair (not new contradictions from another source):
  knowledge/03-ARCHITECTURE-INVARIANTS.yaml INV-016 cited the just-retired
  rights_states.REDISTRIBUTION_ALLOWED key, and prompts/16-reference-
  analysis.md cited the just-retired DERIVED_ANALYSIS/FORENSIC_ALLOWED
  names. Both fixed to the new permission_facts/pipeline_stages vocabulary.
  No other governance file redefined a conflicting rule.

  New structure: permission_facts (FORENSIC_PERMISSION, IMPLEMENTATION_
  PERMISSION, PRODUCTION_CLEARANCE, REDISTRIBUTION_PERMISSION) gate
  pipeline_stages (1_FORENSIC_ANALYSIS, 2_DESIGN_EXTRACTION,
  3_UKBT_ADAPTATION, 4_UKBT_IMPLEMENTATION, 5_PRODUCTION_RELEASE). Prior
  operation_classes retired and folded into the five stages, avoiding a
  third parallel structure. token_lifecycle expanded from RAW/CANDIDATE/
  APPROVED to RAW/CANDIDATE/ADAPTED/APPROVED, with ADAPTED corresponding to
  the newly-explicit UKBT_ADAPTATION stage. Screenshot policy changed from
  an absolute persist-prohibition to governed (transient_comparison:
  ALLOWED, repository_commit: GOVERNED with required provenance,
  redistribution: NOT_ALLOWED_UNLESS_CLEARED).

  CONTRACT_AUDIT = PASS. All 10 knowledge/*.yaml files remain valid YAML.
  BL-02 unchanged: STATED_BUT_UNVERIFIED. No application code changed.
