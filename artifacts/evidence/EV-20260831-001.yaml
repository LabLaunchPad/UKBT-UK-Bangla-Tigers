justification_for_null: >
  Records this document's contents as supplied. First-party (relayed as
  client corrections, the same class already accepted for EV-20260826-026
  and EV-20260826-027), so treated as OBSERVED per
  knowledge/04-EVIDENCE-POLICY.yaml. Two internal conflicts with prior
  evidence are noted, not silently resolved by this record alone — see
  EV-20260831-002 for how each was resolved:
  - This document's Franchise History table conflicts with the site's
    existing Current/Previous split (EV-20260826-026): none of the site's
    4 "Current" entries (London Blaze, Roma Ovest Titans, UK Bangla
    Tigers, Uppsala Tigers) appear in this document at all, and its
    Current Teams column is blank.
  - This document's Overseas Signings list gives Chad Potgieter as South
    Africa and Jeremy Martins as Ireland; the previously-evidenced source
    (EV-20260826-030, the "OVERSEAS SIGNINGS — UPPSALA TIGERS" graphic)
    has both as Portugal.
  - This document spells the Bangladesh signing "Shakib Al Hasan"
    (typed directly by the client in a corrections letter); the prior
    graphic-sourced evidence recorded "Shakibal Hasan" (EV-20260826-030),
    deliberately transcribed exactly as shown on that image without
    asserting identity. A client typing the name directly in a
    corrections document is a stronger, more deliberate signal than an
    OCR-style image read, so this record treats "Shakib Al Hasan" as the
    corrected spelling — see EV-20260831-002.
scope: "Post-launch content correction round — Club Captain page, Franchise History, Our Franchises page, Overseas Signings roster."
