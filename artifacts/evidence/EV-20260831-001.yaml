claim: >
  A supplied 2-page corrections document ("Website_Corrections_1.pdf")
  instructs: (1) on the Club Captain / Players Profile page, remove
  "Founder and CEO" from Mohammad Chowdhury's displayed role, leaving
  "Club Captain"; (2) a revised Franchise History table for Mohammad
  Chowdhury with 8 named Previous Teams (Yankee Royals USA/US Open,
  Bangladesh Tigers of USA USA/Atlanta Open, US All Stars West Indies/
  Caribbean T10, Dynamite Ducks South Africa/LMS World Championship,
  Bangladesh Tigers USA/Diversity Cup, BAS Vampire England/T20 Pro-Am,
  Bangladesh Tigers of USA USA/Motor City Championship, Faisalabad
  Falcons USA/US Open) and an empty Current Teams column; (3) on the Our
  Franchises page, Uppsala Tigers should be reachable via a click from an
  "Our Franchise" list/landing, structured so future franchises can be
  added to that same list; (4) the Uppsala Tigers logo should be changed
  (no replacement file attached); (5) a revised Overseas Signings list
  for Uppsala Tigers naming 10 players with country: Shakib Al Hasan
  (Bangladesh), Mohammad Chowdhury (England), Chad Potgieter (South
  Africa), Owen Palmer (England), Jeremy Martins (Ireland), Jaspreet
  Singh (Italy), Armaan Randhawa (Austria), Karanbir Singh (Austria),
  Shaheryar But (Belgium), Roushan Singh (Portugal).
