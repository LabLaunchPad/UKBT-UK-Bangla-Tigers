notes: >
  Supersedes EV-20260831-006's Roushan Singh resolution (leave unset) —
  that decision was correct given the evidence available at the time;
  this record's new photographic evidence changes the balance and the
  session requester confirmed updating it, per this project's discipline
  of revalidating rather than treating a past decision as permanently
  fixed once new evidence arrives.
