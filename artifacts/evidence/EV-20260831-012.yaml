notes: >
  This is exactly the distinction knowledge/13's truth-classification
  layer (EV-20260831-011) names: EV-20260831-009's "COMPLIANT, checked
  directly" claim for images was accurate for the instances it actually
  inspected (RosterGrid) but was read, on this second pass, as having
  implicitly covered every image in the codebase — it hadn't. No claim
  in EV-20260831-009 was false; its scope was narrower than a casual
  re-reading would suggest. Recorded here so the same narrowing does not
  happen again: "audited card/grid components" is not the same claim as
  "audited every <img> tag."
