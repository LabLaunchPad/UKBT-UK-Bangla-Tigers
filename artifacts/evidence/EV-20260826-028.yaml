notes: >
  If the requester wants actual crawling/downloading performed, the fix
  is changing this session's own configured tool permissions
  (.claude/settings.json's deny list, or granting the permission when
  actually prompted) — not instructing the agent to reinterpret a tested,
  categorical denial as something to route around.
