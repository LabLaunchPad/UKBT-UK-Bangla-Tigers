  This record corrects knowledge/06-TEMPLATE-BOUNDARY.yaml, which had (as of
  the immediately prior commit) listed extract_css_values and
  extract_computed_styles as FORBIDDEN under FORENSIC_ANALYSIS - directly
  contradicting the requester's explicit, specific authorization the same day
  to continue exactly those activities as controlled forensic analysis. Fixed
