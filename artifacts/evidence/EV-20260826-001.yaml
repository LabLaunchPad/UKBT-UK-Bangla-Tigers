related_task: BOOTSTRAP-001
notes: >
  Resolves U-14, which was one of the four Stage-3 blockers. Consequence: the
  reference template's bundled PHP form handlers are not usable and are not a
  migration target. Consequence: U-18 (UK GDPR) moves onto the critical path the
  moment a form is added, since any contact form collects personal data.
