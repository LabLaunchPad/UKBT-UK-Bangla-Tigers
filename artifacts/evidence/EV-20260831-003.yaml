notes: >
  The specification asserts several things about "the existing UKBT
  harness policy" and "the UKBT contract". Each was checked against the
  repository before being echoed; where it was right (roles-not-spawns,
  executed-evidence-over-subjective-approval, the 1920 amendment, the
  five-part standard) this encoding cites the existing source rather than
  duplicating it as if new. No claim in this record rests on the
  specification's own assertion about repository state alone.
