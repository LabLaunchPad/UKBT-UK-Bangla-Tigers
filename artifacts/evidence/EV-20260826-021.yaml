id: EV-20260826-021
classification: VALIDATION_RESULT
claim: >
  contracts/CSS-CONTRACT.md and contracts/REPOSITORY-CONTRACT.md imply
  different filesystem locations for the RAW/CANDIDATE token lifecycle
  stages. The underlying frozen architecture document
  (ARCHITECTURE-PROPOSAL-V3.md) is internally consistent on this point;
  the conflict was introduced when CSS-CONTRACT.md's pipeline diagram
  transcribed the architecture document's §5 generic pipeline-stage
  notation with an unwarranted package-relative co-location implication
  that §3's explicit layer table (and REPOSITORY-CONTRACT.md, which
  transcribes §3 faithfully) does not carry.
source: "Direct inspection of contracts/CSS-CONTRACT.md, contracts/REPOSITORY-CONTRACT.md, and artifacts/architecture/ARCHITECTURE-PROPOSAL-V3.md during Stage 4 Foundation implementation."
source_type: repo
retrieved_at: 2026-08-26
verified_at: 2026-08-26
valid_until: null
justification_for_null: >
  Superseded only by the explicit contract-conflict resolution this
  record identifies as required, not by elapsed time.
scope: >
  Narrow — the filesystem location of RAW/CANDIDATE token stages only.
  Does not affect ADAPTED/APPROVED locations (both contracts agree), the
  Style Dictionary approved-only compile rule (both contracts agree), or
  any other Stage 3 contract content.
method: >
  Implementer (this session) began scaffolding packages/truth/tokens/ per
  Stage 4's FOUNDATION objective, initially created and then removed
  packages/truth/src/tokens/{raw,candidate}/, and unilaterally declared
  REPOSITORY-CONTRACT.md's layer table controlling before continuing —
  an interpretive act the requester correctly identified as improper
  procedure regardless of whether the underlying pick was defensible: a
  detected contract conflict must be reported and left for human
  resolution, not silently resolved by the implementing agent, even when
  one document appears "more specific." Corrected per requester
  instruction: reverted the unilateral README wording, produced a formal
  conflict record (artifacts/verification/CONTRACT-CONFLICT-001.md)
  citing exact line numbers and quoted text from
  ARCHITECTURE-PROPOSAL-V3.md §3 and §5, and left contracts/CSS-CONTRACT.md
  unmodified pending explicit authorization.
result: |
  CONTRACT_CONFLICT = YES, between contracts/CSS-CONTRACT.md and
  contracts/REPOSITORY-CONTRACT.md. AUTHORITATIVE_EVIDENCE exists and is
  HIGH confidence: ARCHITECTURE-PROPOSAL-V3.md §3 (lines 148-152 + its
  stated WHY at lines 158-165) explicitly places RAW/CANDIDATE at
  artifacts/extraction/, outside both apps/web and packages/truth, with a
  reasoned justification (evidence must never be mistaken for UKBT's own
  approved design system). §5 (line 260), the source CSS-CONTRACT.md's
  diagram was drawn from, never actually specifies a package-relative
  path for raw/candidate — that implication was added during Stage 3
  contract drafting. PROPOSED_RESOLUTION: amend CSS-CONTRACT.md's
  pipeline diagram wording only, to state RAW/CANDIDATE's repo-root
  location explicitly, matching the already-frozen architecture decision.
  CONTRACT_MODIFICATION_REQUIRED = YES (CSS-CONTRACT.md only). Not applied
  — awaiting explicit human authorization per contracts/README.md rule 4.
related_files:
  - artifacts/verification/CONTRACT-CONFLICT-001.md
  - contracts/CSS-CONTRACT.md
  - contracts/REPOSITORY-CONTRACT.md
