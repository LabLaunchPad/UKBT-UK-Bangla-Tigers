  - packages/truth/src/tokens/README.md
related_task: TRACK-C-STAGE-4-FOUNDATION
relates_to: [EV-20260826-019]
notes: >
  No contract was modified. packages/truth/tokens/{raw,candidate}/ were
  not created in either interpretation's shape. Foundation work that does
  not depend on this question (packages/truth's gate/schema, the Style
  Dictionary approved-only compile, the Button component primitive)
  continued, since none of it references a raw/candidate path in either
  package. This is the procedural lesson the requester named explicitly:
  detecting a contradiction and picking the "more specific" contract
  without reporting it first is itself a governance failure, independent
  of whether the pick would have turned out correct.
