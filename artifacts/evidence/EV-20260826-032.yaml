id: EV-20260826-032
classification: FIRST_PARTY_CLIENT_DIRECTION
claim: >
  The client directed a full template-UI-parity reconstruction: mirror the
  reference template's page set with section/component/wireframe parity;
  treat all supplied photographs as usable UKBT club imagery; reproduce
  the template's interaction/motion behaviour rebuilt in UKBT's own stack;
  and port the template's exact tokens/CSS rather than approximating them.
source: "Direct client instruction in session, 2026-08-26 (master prompt 'FULL TEMPLATE UI PARITY RECONSTRUCTION' plus three explicit answers to a scoping question and one follow-up clarification)."
source_type: first_party_client_direction
retrieved_at: 2026-08-26
verified_at: 2026-08-26
valid_until: null
justification_for_null: >
  Records a standing client direction about their own site. Does not
  expire; superseded only by a later client instruction.
scope: "Whole-site UI reconstruction. Establishes CLIENT_REQ_009 through CLIENT_REQ_012."
method: >
  Recorded verbatim from the client's own words. Before accepting, the
  three material forks were put back to the client as an explicit choice
  (route scope, photography, motion) rather than assumed; each answer
