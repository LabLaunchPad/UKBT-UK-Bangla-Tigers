result: |
  VERBATIM CLIENT DIRECTION (four instructions):

  1. ROUTE SCOPE (→ CLIENT_REQ_009): "Mirror all template pages with
     section parity, shells where we will put UK bqnglas content and
     branding assets as per UI templates pqges" [sic].

  2. PHOTOGRAPHY (→ CLIENT_REQ_010): "Treat all supplied photos as usable
     club imagery."

  3. MOTION/INTERACTION (→ CLIENT_REQ_011): "Same as template but tailored
     to UK by tech stacks frameworks and its assets and contemt" [sic].

  4. TOKENS/CSS (→ CLIENT_REQ_012): "To get same exact UI as UI shell
     template we do need to ensure exact token and css and these must be
     tailored and converted for our UK Bangla tigers frameworks tech
     stacks."

  WHAT THIS AUTHORISES, AND WHAT IT DOES NOT:

  - Authorises the route set. `ROUTE-CONTRACT.md`'s change-authority
    clause requires "independent UKBT evidence for that route's
    existence — 'Adelux has a page like this' is not sufficient." This
    record IS that independent evidence: it is the site owner instructing
    what their own site should contain. The justification for
    e.g. a membership route is this instruction, never "the template has
    membership.html."

  - Authorises photographic use on AFFILIATION grounds only. It
    supersedes the `image_affiliation_caution` in EV-20260826-030 and
    `knowledge/01-VERIFIED-FACTS.yaml` (images whose kit/branding did not
    visibly match UKBT). It does NOT supersede CLIENT_REQ_008, a
    different instruction about a named individual. Accordingly
    `nordic-smash-slide.webp` REMAINS EXCLUDED: it displays "NIPO KHADEM"
    in the image pixels (EV-20260826-031), and removing that person is
    itself a client instruction. Affiliation doubt is overridden;
    a named-person removal is not.

  - Does NOT promote these images to independently-verified UKBT team
    photography. Their classification is "client-authorised for use,"
    attributed to this record. The underlying observation stands: sampled
    images show at least four different kits, none carrying the UKBT
    crest (gallery-01 "Optical Prime" kit; gallery-08 "Leaf Care"/Safari
    Cup 2024 kit, same as the previously-excluded home-hero; gallery-12 an
    unidentified individual with a Safari T20 Cup trophy; gallery-19 a
    green/blue numbered kit). The client has authority over their own
    supplied assets; this project does not restate their authorisation as
    its own verification.

  - Does NOT authorise inventing content. Template sections with no UKBT
    evidence (pricing tiers, membership benefits, testimonials, FAQ
    answers, blog articles, venue/map) render as shells marked
    CONTENT_STATUS = UNKNOWN. CLAUDE.md's "never invent facts" invariant
    is untouched by this record.

  MEASURED FINDING recorded alongside (motivating CLIENT_REQ_012): the
  current token scale cannot express the template's geometry. Template
  section padding is 120px and its dominant rhythm gap 100px, where this
  repo's spacing scale tops out at `space-8` = 32px; template h1 is 90px
  vs our 48.8px, h2 64px vs 31.2px, paragraph 18px vs 12.8px, container
  1340px vs 1440px. This is the structural reason prior builds read as
  generic/compact rather than as the template, and is why the client's
  fourth instruction targets the token layer specifically.
