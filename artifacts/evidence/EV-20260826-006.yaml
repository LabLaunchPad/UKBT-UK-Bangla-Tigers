notes: >
  This record establishes what the RULES ARE, sourced to Envato's own pages.
  It does NOT establish which rules apply to this copy, and does not by itself
  move BL-02 toward closure. Per DR-005 (a missing licence is not a verified
  licence) and the task's own instruction, general public terms cannot close
  BL-02 in the absence of purchase-specific evidence.

  The most consequential finding for UKBT's stated long-term goal (reuse as a
  basis for another website) is structural and tier-independent: EVERY standard
  Envato acquisition path caps at ONE end product. Reuse for a second,
  independent website is not a licence-verification question that gets easier
  with better paperwork — it requires an ADDITIONAL licence (or Elements
  project) regardless of which tier this copy turns out to be.
