  THEMEFOREST REGULAR LICENSE (per themeforest.net/licenses/terms/regular):
    - One End Product only, for yourself or ONE client ("single application").
    - End Product may be distributed FREE only. Cannot Sell the End Product
      except a one-time transfer to that one client for a fee.
    - Modification and derivative works ARE permitted, bounded by End Product
      scope.
    - Cannot extract and use a single component on a stand-alone basis.
    - Cannot redistribute the Item itself (as template/source/stock), modified
      or not, even for free.

  THEMEFOREST EXTENDED LICENSE (per themeforest.net/licenses/terms/extended):
    - Still ONE End Product only ("single application" — this does not change
      between tiers).
    - End Product MAY be sold/resold to many end users.
    - Same redistribution and component-extraction prohibitions as Regular.

  BOTH TIERS, PER ENVATO'S OWN MULTI-END-PRODUCT GUIDANCE:
    "For most items, each license allows you to make ONE unique end product...
    the license can only be activated once per domain." Making a second,
    independent end product (e.g. a second website) requires purchasing an
    ADDITIONAL licence. Neither Regular nor Extended is a multi-use licence for
    a standard template item.

  ATTRIBUTION: not a legal requirement of the standard licence (courtesy only)
    — distinct from Font Awesome/Isotope/animate.css, which impose their OWN,
    separate attribution/compliance obligations regardless of the Adelux tier.

  ENVATO ELEMENTS (the OTHER channel, if that is how this copy was acquired):
    - Licensed per PROJECT, one licence per end product, via subscription.
    - Once an end product is completed while the subscription is active, that
      use becomes perpetual even after the subscription lapses.
    - A second project needs a new licence created for it (not a new purchase
      necessarily, but a new licensing event tied to an active subscription at
      the time of completion).
    - No Regular/Extended tier distinction on this channel — one set of terms.

  CONFIDENCE: HIGH for the terms as Envato states them generally, on the
  pages cited. LOW for which terms apply to THIS copy, because the specific
  channel, tier, purchaser, and date are not established by anything in this
  repository or the supplied package (EV-20260826-005).
