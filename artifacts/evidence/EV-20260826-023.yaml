  Envato Elements' own published licence terms confirming what an
  Elements subscription permits (adaptation for one End Product is
  typically standard and would likely cover this use — but needs to be
  read from Envato's terms page, not inferred), plus something
  reconciling "licensee" with "authority to instruct an adaptation
  project" if those are meant to be treated as equivalent here.
