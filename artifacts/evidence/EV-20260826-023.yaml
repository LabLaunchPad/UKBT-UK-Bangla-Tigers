  CONFLICTING — this evidence answers "does someone hold an Elements
  licence for this item" (yes, plausibly), not "who has authority to
  permit UKBT adaptation" (still unresolved, and if anything this
  reinforces Fox_Creation as author rather than LabLaunchPad). Items 1,
