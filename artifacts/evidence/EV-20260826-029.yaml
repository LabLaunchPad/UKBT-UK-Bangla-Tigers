id: EV-20260826-029
classification: FIRST_PARTY_CLIENT_SUPPLIED
claim: >
  A supplied archive ("ubtbrandingassets.zip") contains real UKBT
  branding material: a shield-crest logo (multiple sizes/formats), a
  favicon SVG, apple-touch-icon/favicon PNGs, 3 font files (Lato ×2
  weights, Montserrat variable), a hero photo, 20 gallery photos, 4
  leadership images (including a real "management team" announcement
  graphic), 1 Uppsala Tigers image, and 1 OpenGraph social-card image —
  40 real files, 3.8MB total. Its bundled README claims specific
  provenance (exported from a repo named "LabLaunchPad/UK-Bangla-Tigers,"
  referencing packages/truth/src/brand.ts, docs/12-media-assets.md,
  apps/web/public/media/players/).
source: "Uploaded archive (e17f27fd-ubtbrandingassets.zip, 3,831,063 bytes), extracted and read in full."
source_type: first_party_client_supplied
